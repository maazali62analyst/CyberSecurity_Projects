<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Encrypt a Message</title>
     <!-- <link rel="stylesheet" href="style.css"> -->
     <link rel="stylesheet" href="style2.css">
</head>
<body>
     <header>
          <img src="img/DES.png" alt="">
          <nav>
            <ul class="nav-links">
              <li><a href="index.html">Home</a></li>
              <li><a href="about_us.html">About Us</a></li>
            </ul>
          </nav>
          <a href="encrypt.html"><button>Start Encryption</button></a>
       </header>
       <div class="container">
        <h1>DES Encryption Tool</h1>
        <textarea id="inputText" placeholder="Enter text to encrypt"></textarea>
        <div class="input-container">
          <input type="text" id="secretKey" placeholder="Enter 64-bit key" maxlength="16">
          <button id="copyKeyButton" class="copy-button " style="display: none;">Copy Key</button>
        </div>
        <br>
        <button class="bbt" onclick="generateKey()">Generate 64-bit Key</button>
        <button class="bbt" onclick="encrypt()">Encrypt</button>
        <!-- <button class="bbt" onclick="decrypt()">Decrypt</button> -->
        <div class="result">
          <strong>Result:</strong>
          <div class="result-container">
            <div id="loader" class="loader" style="display: none;"></div> <!-- Loader -->
            <p id="resultText"></p>
            
          </div>
          <button id="copyResultButton" class="copy-button cpp" style="display: none;">Copy Result</button>
        </div>
      </div>
      <div class="cont container">
      <a href="decrypt.html">Decrypt an Encrypted Message</a>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js">
    </script>      
    <script>
   // Function to generate a 56-bit DES key
function generateKey() {
  const key = CryptoJS.lib.WordArray.random(8); // 8 bytes = 64 bits (56 bits effective)
  document.getElementById('secretKey').value = CryptoJS.enc.Hex.stringify(key);
  document.getElementById('copyKeyButton').style.display = 'inline-block'; // Show copy button
}

// Function to encrypt using DES
function encrypt() {
  const inputText = document.getElementById('inputText').value;
  const secretKey = document.getElementById('secretKey').value;

  // Validate input
  if (!inputText || !secretKey) {
    alert('Please enter text and a secret key.');
    return;
  }

  // Show loader
  const loader = document.getElementById('loader');
  const resultText = document.getElementById('resultText');
  const copyResultButton = document.getElementById('copyResultButton');

  loader.style.display = 'block'; // Show loader
  resultText.innerText = ''; // Clear previous result
  copyResultButton.style.display = 'none'; // Hide copy button

  // Simulate encryption delay (3 seconds)
  setTimeout(() => {
    // Hide loader
    loader.style.display = 'none';

    // Perform DES encryption
    const encrypted = CryptoJS.DES.encrypt(inputText, secretKey).toString();
    resultText.innerText = encrypted;

    // Show copy button
    copyResultButton.style.display = 'inline-block';
  }, 3000); // 3-second delay
}

// Function to decrypt using DES
function decrypt() {
  const inputText = document.getElementById('inputText').value;
  const secretKey = document.getElementById('secretKey').value;

  // Validate input
  if (!inputText || !secretKey) {
    alert('Please enter text and a secret key.');
    return;
  }

  // Show loader
  const loader = document.getElementById('loader');
  const resultText = document.getElementById('resultText');
  const copyResultButton = document.getElementById('copyResultButton');

  loader.style.display = 'block'; // Show loader
  resultText.innerText = ''; // Clear previous result
  copyResultButton.style.display = 'none'; // Hide copy button

  // Simulate decryption delay (3 seconds)
  setTimeout(() => {
    // Hide loader
    loader.style.display = 'none';

    // Perform DES decryption
    try {
      const decrypted = CryptoJS.DES.decrypt(inputText, secretKey).toString(CryptoJS.enc.Utf8);
      if (!decrypted) {
        throw new Error('Decryption failed. Invalid key or input.');
      }
      resultText.innerText = decrypted;
    } catch (error) {
      resultText.innerText = 'Decryption failed. Invalid key or input.';
    }

    // Show copy button
    copyResultButton.style.display = 'inline-block';
  }, 3000); // 3-second delay
}

// Function to copy text to clipboard
function copyToClipboard(text) {
  navigator.clipboard.writeText(text)
    .then(() => alert('Copied to clipboard!'))
    .catch(() => alert('Failed to copy!'));
}

// Attach event listeners to copy buttons
document.getElementById('copyKeyButton').addEventListener('click', () => {
  const key = document.getElementById('secretKey').value;
  copyToClipboard(key);
});

document.getElementById('copyResultButton').addEventListener('click', () => {
  const result = document.getElementById('resultText').innerText;
  copyToClipboard(result);
});
   
       </script>
</body>
</html>
